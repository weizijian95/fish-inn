<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>精灵客栈</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- 完整样式 - 不依赖CDN -->
    <style>
        /* Tailwind 备用样式 - 核心布局类 */
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        /* Flexbox 布局 */
        .flex { display: flex !important; }
        .flex-col { flex-direction: column !important; }
        .flex-grow { flex-grow: 1 !important; }
        .items-center { align-items: center !important; }
        .justify-center { justify-content: center !important; }
        .justify-end { justify-content: flex-end !important; }
        .justify-between { justify-content: space-between !important; }
        .inline-flex { display: inline-flex !important; }
        
        /* 尺寸 */
        .w-full { width: 100% !important; }
        .w-8 { width: 2rem !important; }
        .h-8 { height: 2rem !important; }
        .h-2 { height: 0.5rem !important; }
        .h-1 { height: 0.25rem !important; }
        .h-1\.5 { height: 0.375rem !important; }
        .min-h-screen { min-height: 100vh !important; }
        .max-w-md { max-width: 28rem !important; }
        .max-w-2xl { max-width: 42rem !important; }
        .max-w-4xl { max-width: 56rem !important; }
        .max-w-6xl { max-width: 72rem !important; }
        
        /* 间距 */
        .gap-2 { gap: 0.5rem !important; }
        .gap-3 { gap: 0.75rem !important; }
        .gap-4 { gap: 1rem !important; }
        .gap-6 { gap: 1.5rem !important; }
        .gap-8 { gap: 2rem !important; }
        .px-4 { padding-left: 1rem !important; padding-right: 1rem !important; }
        .px-6 { padding-left: 1.5rem !important; padding-right: 1.5rem !important; }
        .py-2 { padding-top: 0.5rem !important; padding-bottom: 0.5rem !important; }
        .py-3 { padding-top: 0.75rem !important; padding-bottom: 0.75rem !important; }
        .py-4 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
        .py-6 { padding-top: 1.5rem !important; padding-bottom: 1.5rem !important; }
        .py-10 { padding-top: 2.5rem !important; padding-bottom: 2.5rem !important; }
        .py-12 { padding-top: 3rem !important; padding-bottom: 3rem !important; }
        .mb-2 { margin-bottom: 0.5rem !important; }
        .mb-3 { margin-bottom: 0.75rem !important; }
        .mb-4 { margin-bottom: 1rem !important; }
        .mb-6 { margin-bottom: 1.5rem !important; }
        .mb-8 { margin-bottom: 2rem !important; }
        .mb-10 { margin-bottom: 2.5rem !important; }
        .mb-12 { margin-bottom: 3rem !important; }
        .mt-2 { margin-top: 0.5rem !important; }
        .mt-4 { margin-top: 1rem !important; }
        .mt-8 { margin-top: 2rem !important; }
        .mx-auto { margin-left: auto !important; margin-right: auto !important; }
        
        /* 容器 */
        .container {
            width: 100%;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        
        /* 文本 */
        .text-center { text-align: center !important; }
        .text-left { text-align: left !important; }
        .text-sm { font-size: 0.875rem !important; }
        .text-lg { font-size: 1.125rem !important; }
        .text-xl { font-size: 1.25rem !important; }
        .text-2xl { font-size: 1.5rem !important; }
        .text-3xl { font-size: 1.875rem !important; }
        .text-4xl { font-size: 2.25rem !important; }
        .text-5xl { font-size: 3rem !important; }
        .text-6xl { font-size: 3.75rem !important; }
        .font-medium { font-weight: 500 !important; }
        .font-bold { font-weight: 700 !important; }
        .text-gray-500 { color: #6b7280 !important; }
        .text-gray-600 { color: #4b5563 !important; }
        .text-gray-700 { color: #374151 !important; }
        .text-gray-800 { color: #1f2937 !important; }
        .text-white { color: #ffffff !important; }
        .text-primary { color: #4F46E5 !important; }
        .text-secondary { color: #EC4899 !important; }
        
        /* 背景 */
        .bg-white { background-color: #ffffff !important; }
        .bg-gray-50 { background-color: #f9fafb !important; }
        .bg-gray-100 { background-color: #f3f4f6 !important; }
        .bg-gray-200 { background-color: #e5e7eb !important; }
        .bg-gray-400 { background-color: #9ca3af !important; }
        .bg-gray-500 { background-color: #6b7280 !important; }
        .bg-gradient-to-br { background-image: linear-gradient(to bottom right, var(--tw-gradient-stops)) !important; }
        .bg-gradient-to-b { background-image: linear-gradient(to bottom, var(--tw-gradient-stops)) !important; }
        .bg-gradient-to-r { background-image: linear-gradient(to right, var(--tw-gradient-stops)) !important; }
        .from-indigo-50 { --tw-gradient-from: #eef2ff !important; --tw-gradient-to: rgba(238, 242, 255, 0) !important; }
        .to-purple-50 { --tw-gradient-to: #faf5ff !important; }
        .from-primary { --tw-gradient-from: #4F46E5 !important; --tw-gradient-to: rgba(79, 70, 229, 0) !important; }
        .to-secondary { --tw-gradient-to: #EC4899 !important; }
        /* 直接渐变类（不依赖CSS变量） */
        .bg-gradient-to-br.from-indigo-50.to-purple-50 { background-image: linear-gradient(to bottom right, #eef2ff, #faf5ff) !important; }
        .bg-gradient-to-r.from-primary.to-secondary { background-image: linear-gradient(to right, #4F46E5, #EC4899) !important; }
        
        /* 边框和圆角 */
        .rounded-full { border-radius: 9999px !important; }
        .rounded-lg { border-radius: 0.5rem !important; }
        .rounded-xl { border-radius: 0.75rem !important; }
        .rounded-2xl { border-radius: 1rem !important; }
        .border { border-width: 1px !important; }
        .border-2 { border-width: 2px !important; }
        .border-4 { border-width: 4px !important; }
        .border-gray-200 { border-color: #e5e7eb !important; }
        .border-transparent { border-color: transparent !important; }
        
        /* 阴影 */
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important; }
        .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important; }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important; }
        .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1) !important; }
        
        /* 定位 */
        .relative { position: relative !important; }
        .absolute { position: absolute !important; }
        .fixed { position: fixed !important; }
        .inset-0 { top: 0 !important; right: 0 !important; bottom: 0 !important; left: 0 !important; }
        .inset-y-0 { top: 0 !important; bottom: 0 !important; }
        .left-0 { left: 0 !important; }
        .right-0 { right: 0 !important; }
        .top-0 { top: 0 !important; }
        .bottom-8 { bottom: 2rem !important; }
        .left-1\/2 { left: 50% !important; }
        .pl-4 { padding-left: 1rem !important; }
        .pl-12 { padding-left: 3rem !important; }
        .pr-4 { padding-right: 1rem !important; }
        
        /* 显示/隐藏 */
        .hidden { display: none !important; }
        .block { display: block !important; }
        
        /* 变换 */
        .transform { transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y)) !important; }
        .-translate-x-1\/2 { --tw-translate-x: -50% !important; transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y)) !important; }
        
        /* 透明度 */
        .opacity-0 { opacity: 0 !important; }
        .opacity-100 { opacity: 1 !important; }
        .opacity-50 { opacity: 0.5 !important; }
        
        /* Z-index */
        .z-50 { z-index: 50 !important; }
        
        /* 过渡 */
        .transition-all { transition-property: all !important; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1) !important; transition-duration: 150ms !important; }
        .transition-colors { transition-property: color, background-color, border-color !important; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1) !important; transition-duration: 150ms !important; }
        .duration-300 { transition-duration: 300ms !important; }
        
        /* 头像样式 */
        img[id*="Avatar"], img[alt="头像"] {
            max-width: 32px !important;
            max-height: 32px !important;
            width: 32px !important;
            height: 32px !important;
            object-fit: cover !important;
            border-radius: 50% !important;
        }
        
        /* 按钮和交互 */
        button, a.button {
            cursor: pointer;
            border: none;
            background: none;
        }
        button:hover, a:hover {
            opacity: 0.9;
        }
        
        /* 输入框 */
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        /* 响应式文本大小 */
        .text-\[clamp\(1\.8rem\,5vw\,2\.5rem\)\] { font-size: clamp(1.8rem, 5vw, 2.5rem) !important; }
        .text-\[clamp\(1rem\,3vw\,1\.1rem\)\] { font-size: clamp(1rem, 3vw, 1.1rem) !important; }
        .text-\[clamp\(1rem\,3vw\,1\.2rem\)\] { font-size: clamp(1rem, 3vw, 1.2rem) !important; }
        
        /* 溢出 */
        .overflow-hidden { overflow: hidden !important; }
        .overflow-y-auto { overflow-y: auto !important; }
        
        /* 其他常用类 */
        .space-y-3 > * + * { margin-top: 0.75rem !important; }
        .space-y-4 > * + * { margin-top: 1rem !important; }
        .leading-relaxed { line-height: 1.625 !important; }
        .pointer-events-none { pointer-events: none !important; }
        
        /* 动画 */
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
    
    <!-- 自定义样式类 -->
    <style>
            .content-auto {
                content-visibility: auto;
            }
            .input-focus:focus {
            border-color: #4F46E5 !important;
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2) !important;
            }
            .btn-bounce {
            transition-property: transform !important;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1) !important;
            transition-duration: 300ms !important;
            }
            .btn-bounce:active {
            transform: scale(0.95) !important;
        }
        /* 自定义颜色 */
        .bg-primary { background-color: #4F46E5 !important; }
        .bg-primary\/90 { background-color: rgba(79, 70, 229, 0.9) !important; }
        .text-primary { color: #4F46E5 !important; }
        .bg-secondary { background-color: #EC4899 !important; }
        .text-secondary { color: #EC4899 !important; }
        .hover\:bg-primary\/90:hover { background-color: rgba(79, 70, 229, 0.9) !important; }
        .hover\:shadow-primary\/20:hover { box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.2) !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen flex flex-col">
    <!-- 顶部装饰 -->
    <div class="w-full h-2 bg-gradient-to-r from-primary to-secondary"></div>

    <!-- 用户状态栏 -->
    <div class="container mx-auto px-6 py-4">
        <div class="flex justify-end">
            <!-- 未登录状态 -->
            <div id="notLoggedIn" class="hidden">
                <button onclick="goToLogin()" class="inline-flex items-center gap-2 bg-white hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-full transition-all duration-300 shadow-sm border border-gray-200">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>登录/注册</span>
                </button>
            </div>
            
            <!-- 已登录状态 -->
            <div id="loggedIn" class="hidden flex items-center gap-3">
                <div class="flex items-center gap-2 bg-white rounded-full py-2 px-4 shadow-sm border border-gray-200">
                    <img id="userAvatar" src="" alt="头像" class="w-8 h-8 rounded-full">
                    <span id="userNickname" class="text-gray-700 font-medium"></span>
                </div>
                <button onclick="logout()" class="text-gray-500 hover:text-gray-700 transition-colors">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 py-12">
        <!-- 标题区域 -->
        <div class="text-center mb-12">
            <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-gray-800 mb-3">
                Hi,欢迎来到精灵客栈~
            </h1>
            <p class="text-gray-500 text-[clamp(1rem,3vw,1.1rem)]">
                你想要去哪间客房呢~
            </p>
        </div>
        
        <!-- 输入框区域 -->
        <div class="w-full max-w-md">
            <div class="relative mb-6">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fas fa-key text-gray-400 text-lg"></i>
                </div>
                <input 
                    type="text" 
                    id="roomInput" 
                    placeholder="请输入房间号" 
                    class="w-full pl-12 pr-4 py-4 rounded-xl border border-gray-300 text-gray-700 text-[clamp(1rem,3vw,1.2rem)] input-focus shadow-sm transition-all duration-300"
                    inputmode="numeric"
                    maxlength="4"
                >
            </div>
            
            <!-- 按钮 -->
            <button 
                id="submitBtn" 
                class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-4 px-6 rounded-xl transition-all duration-300 shadow-lg hover:shadow-primary/20 btn-bounce flex items-center justify-center gap-2 text-[clamp(1rem,3vw,1.2rem)]"
            >
                <span>进入房间</span>
                <i class="fas fa-arrow-right"></i>
            </button>
            
            <!-- 提示文本 -->
            <p class="text-center text-gray-500 text-sm mt-4">
                客栈装修中……预计11.21开始营业，当前你可以去任意房间！
            </p>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="py-6 text-center text-gray-400 text-sm">
        <p>©Fish Homepage 2025 -> Forever </p>
    </footer>

    <!-- 引入登录模块 -->
    <script src="auth-modal.js"></script>

    <script>
        // 获取元素
        const roomInput = document.getElementById('roomInput');
        const submitBtn = document.getElementById('submitBtn');
        
        // 初始化页面
        window.addEventListener('DOMContentLoaded', () => {
            updateUserUI();
            roomInput.focus();
        });
        
        // 用户管理函数
        function getUserInfo() {
            const userStr = localStorage.getItem('user');
            return userStr ? JSON.parse(userStr) : null;
        }
        
        function updateUserUI() {
            const user = getUserInfo();
            const notLoggedIn = document.getElementById('notLoggedIn');
            const loggedIn = document.getElementById('loggedIn');
            
            if (user) {
                notLoggedIn.classList.add('hidden');
                loggedIn.classList.remove('hidden');
                document.getElementById('userNickname').textContent = user.nickname;
                document.getElementById('userAvatar').src = user.avatar;
            } else {
                notLoggedIn.classList.remove('hidden');
                loggedIn.classList.add('hidden');
            }
        }
        
        function goToLogin() {
            openAuthModal('login');
        }
        
        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            updateUserUI();
            showToast('已退出登录');
        }
        
        // 处理输入跳转
        function handleRoomNavigation() {
            const roomNumber = roomInput.value.trim();
            
            // 输入验证
            if (!roomNumber) {
                showToast('请输入房间号');
                return;
            }
            
            if (!/^\d+$/.test(roomNumber)) {
                showToast('请输入数字');
                return;
            }
            
            // 跳转逻辑
            switch(roomNumber) {
                case '1121':
                    window.location.href = '1121.html';
                    break;
                case '1122':
                    window.location.href = '1122.html';
                    break;
                case '520':
                    window.location.href = '520.html';
                    break;
                default:
                    showToast('房间号不存在');
            }
        }
        
        // 显示提示消息
        function showToast(message) {
            // 创建toast元素
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 transition-all duration-300 opacity-0';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // 显示动画
            setTimeout(() => {
                toast.classList.replace('opacity-0', 'opacity-100');
            }, 10);
            
            // 3秒后隐藏
            setTimeout(() => {
                toast.classList.replace('opacity-100', 'opacity-0');
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }
        
        // 绑定事件
        submitBtn.addEventListener('click', handleRoomNavigation);
        
        // 支持回车键提交
        roomInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleRoomNavigation();
            }
        });
    </script>
</body>
</html>
